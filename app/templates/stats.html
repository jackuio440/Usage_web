{% extends "base.html" %}
{% block content %}
<div class="row" style="margin-bottom:12px">
  <h1 style="margin:0">{{ t('stats.title') }}</h1>
  <span class="spacer"></span>
  <label class="small">{{ t('stats.show') }}
    <select id="weeks"><option value="1">{{ t('stats.week1') }}</option><option value="4" selected>{{ t('stats.week4') }}</option><option value="12">{{ t('stats.week12') }}</option></select>
  </label>
</div>
<p class="muted small">{{ t('stats.help') }}</p>
<div class="legend" style="margin-bottom:12px">
  <span><i class="dot" style="background:var(--series-1)"></i>{{ t('stats.booked') }}</span>
  <span><i class="dot" style="background:var(--series-2)"></i>{{ t('stats.used') }}</span>
</div>
<div id="weeks-out" class="stack"></div>
{% endblock %}
{% block scripts %}<script src="/static/js/stats.js"></script>{% endblock %}
