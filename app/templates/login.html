<!doctype html>
<html lang="{{ 'zh-Hant-TW' if lang == 'zh' else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login.title') }} · {{ site_title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" method="post" action="/login">
      <div class="row" style="margin-bottom:8px">
        <h1 style="margin:0">{{ site_title }}</h1>
        <span class="spacer"></span>
        <a class="lang-switch" href="/lang/{{ 'en' if lang == 'zh' else 'zh' }}?next=/login">{{ t('lang.switch') }}</a>
      </div>
      <p class="muted small">{{ t('login.help') }}</p>
      {% if cfg.mock %}<div class="notice small">{{ t('login.mock') }}</div>{% endif %}
      {% if error %}<div class="notice error small">{{ error }}</div>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field"><span>{{ t('login.username') }}</span><input name="username" value="{{ username }}" autocomplete="username" autofocus required></label>
      <label class="field"><span>{{ t('login.password') }}</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit" style="width:100%">{{ t('login.submit') }}</button>
    </form>
  </div>
</body>
</html>
